id = "float.pi-outliner"
name = "Pi Outliner"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Persistent block workspace shared by Pi agents and the user"
platforms = ["linux", "macos"]

[[panes]]
id = "service"
title = "Outliner Service"
placement = "tab"
command = ["bun", "run", "src/server-main.ts"]

[[panes]]
id = "outliner"
title = "Outliner"
placement = "split"
command = ["bun", "run", "src/outliner.ts"]

[[panes]]
id = "detail"
title = "Outliner Detail"
placement = "split"
command = ["bun", "run", "src/detail-main.ts"]

[[actions]]
id = "open"
title = "Focus existing or open first outliner"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "run", "src/herdr-open.ts"]

[[actions]]
id = "open-here"
title = "Open another Tree and Detail here"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "run", "src/herdr-open.ts", "--mode", "open-here"]

[[actions]]
id = "focus-existing"
title = "Focus the unique existing Tree"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "run", "src/herdr-open.ts", "--mode", "focus-existing"]

[[actions]]
id = "navigate"
title = "Navigate to outliner identity"
contexts = ["pane"]
command = ["bun", "run", "src/herdr-link-open.ts"]

[[link_handlers]]
id = "outliner-navigation"
title = "Navigate Outliner"
pattern = "^pi-outliner://(block|goto|page|work)/[^[:space:]]+$"
action = "navigate"
