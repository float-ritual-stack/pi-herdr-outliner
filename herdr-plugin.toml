id = "float.pi-outliner"
name = "Pi Outliner"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Persistent block workspace shared by Pi agents and the user"
platforms = ["linux", "macos"]

[[panes]]
id = "service"
title = "Outliner Service"
placement = "tab"
command = ["bun", "run", "src/server-main.ts"]

[[panes]]
id = "outliner"
title = "Outliner"
placement = "split"
command = ["bun", "run", "src/outliner.ts"]

[[panes]]
id = "detail"
title = "Outliner Detail"
placement = "split"
command = ["bun", "run", "src/detail-main.ts"]

[[actions]]
id = "open-layout"
title = "Outliner: open Tree + two Details working layout"
description = "Build the standard four-pane Outliner layout in an otherwise empty tab."
contexts = ["workspace", "tab", "pane"]
command = ["bun", "run", "src/herdr-open.ts", "--mode", "open-layout"]

[[actions]]
id = "layout-detail-a"
title = "Outliner layout: Detail A full height"
description = "Keep the shell on the right and make the Detail sharing the Tree context full height."
contexts = ["workspace", "tab", "pane"]
command = ["bun", "run", "src/herdr-layout-action.ts", "detail-a"]

[[actions]]
id = "layout-detail-b"
title = "Outliner layout: Detail B full height"
description = "Keep the shell on the right and make the secondary Detail full height."
contexts = ["workspace", "tab", "pane"]
command = ["bun", "run", "src/herdr-layout-action.ts", "detail-b"]

[[actions]]
id = "layout-tree-wide"
title = "Outliner layout: Tree wide, Details underneath"
description = "Span the Tree across the Outliner area with Detail A and Detail B underneath."
contexts = ["workspace", "tab", "pane"]
command = ["bun", "run", "src/herdr-layout-action.ts", "tree-wide"]

[[actions]]
id = "navigate"
title = "Internal: handle pi-outliner:// link"
contexts = ["pane"]
command = ["bun", "run", "src/herdr-link-open.ts"]

[[link_handlers]]
id = "outliner-navigation"
title = "Navigate Outliner"
pattern = "^pi-outliner://(block|goto|page|work)/[^[:space:]]+$"
action = "navigate"
