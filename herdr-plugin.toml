id = "float.pi-outliner"
name = "Pi Outliner"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Persistent block workspace shared by Pi agents and the user"
platforms = ["linux", "macos"]

[[panes]]
id = "service"
title = "Outliner Service"
placement = "tab"
command = ["bun", "run", "src/server-main.ts"]

[[panes]]
id = "outliner"
title = "Outliner"
placement = "split"
command = ["bun", "run", "src/outliner.ts"]

[[panes]]
id = "detail"
title = "Outliner Detail"
placement = "split"
command = ["bun", "run", "src/detail-main.ts"]

[[panes]]
id = "capture"
title = "Quick Capture"
placement = "popup"
width = "72%"
height = "64%"
command = ["bun", "run", "src/capture-main.ts"]

[[panes]]
id = "backlink-peek"
title = "Backlink Peek"
placement = "popup"
width = "78%"
height = "76%"
command = ["bun", "run", "src/backlink-peek-main.ts"]


[[actions]]
id = "open"
title = "Outliner: open or focus"
description = "Focus the Outliner in this project, or open a Tree and linked Detail when none exists."
contexts = ["workspace", "tab", "pane"]
command = ["bun", "run", "src/herdr-link-open.ts"]

[[actions]]
id = "ensure-detail"
title = "Outliner: open or focus Detail"
description = "Focus an existing Detail in this tab, preferring the Tree-linked one, or create one when the tab has none."
contexts = ["workspace", "tab", "pane"]
command = ["bun", "run", "src/herdr-open.ts", "--mode", "ensure-detail"]

[[actions]]
id = "open-here"
title = "Outliner: open new Tree + Detail here"
description = "Always open a new Tree and linked Detail beside the invoking pane."
contexts = ["workspace", "tab", "pane"]
command = ["bun", "run", "src/herdr-open.ts", "--mode", "open-here"]


[[link_handlers]]
id = "outliner-navigation"
title = "Navigate Outliner"
pattern = "^pi-outliner://(block|goto|page|work)/[^[:space:]]+$"
action = "open"
